<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>대외활동 내용 수정하기</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase_config.js"></script>
    <script src="admin_key.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <a href="activities_board.html" class="back-button">목록으로</a>
    
    <h1>대외활동 내용 수정하기</h1>

    <form id="edit-form">
        <label for="post-title">제목:</label><br>
        <input type="text" id="post-title" name="post-title"><br><br>

        <label for="post-image">활동 사진 또는 PDF (선택):</label><br>
        <input type="file" id="post-image" accept="image/*,.pdf"><br>
        <img id="image-preview" alt="활동 사진 미리보기" style="display: none; max-width: 100%; max-height: 300px; margin: 10px 0; object-fit: contain;">
        <iframe id="pdf-preview" title="선택한 PDF 미리보기" style="display: none; width: 100%; height: 400px; margin: 10px 0; border: 1px solid #ddd;"></iframe><br>

        <label for="post-content">내용:</label><br>
        <textarea id="post-content" name="post-content" rows="10" cols="50"></textarea><br><br>

        <button type="submit">수정 완료</button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        let post = null;
        let imageBase64 = '';

        document.getElementById('post-image').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/') && file.type !== 'application/pdf') {
                alert('이미지 또는 PDF 파일만 선택해주세요.');
                this.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                imageBase64 = event.target.result;
                const imagePreview = document.getElementById('image-preview');
                const pdfPreview = document.getElementById('pdf-preview');
                if (file.type === 'application/pdf') {
                    pdfPreview.src = imageBase64;
                    pdfPreview.style.display = 'block';
                    imagePreview.style.display = 'none';
                } else {
                    imagePreview.src = imageBase64;
                    imagePreview.style.display = 'block';
                    pdfPreview.style.display = 'none';
                }
            };
            reader.readAsDataURL(file);
        });

        // 기존 데이터 불러오기
        db.ref('posts/' + id).once('value').then((snapshot) => {
            post = snapshot.val();
            if (!post) {
                alert('존재하지 않는 글입니다.');
                window.location.href = 'activities_board.html';
                return;
            }

            const isAdmin = sessionStorage.getItem('isAdmin') === 'true';

            if (isAdmin) {
                document.getElementById('post-title').value = post.title;
                document.getElementById('post-content').value = post.content;
                imageBase64 = post.image || '';
                if (imageBase64) {
                    const imagePreview = document.getElementById('image-preview');
                    const pdfPreview = document.getElementById('pdf-preview');
                    if (imageBase64.startsWith('data:application/pdf')) {
                        pdfPreview.src = imageBase64;
                        pdfPreview.style.display = 'block';
                    } else {
                        imagePreview.src = imageBase64;
                        imagePreview.style.display = 'block';
                    }
                }
            } else {
                alert('관리자만 수정할 수 있습니다.');
                window.location.href = `view.html?id=${id}`;
            }
        });

        document.getElementById('edit-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            db.ref('posts/' + id).update({
                title: title,
                content: content,
                image: imageBase64
            }).then(() => {
                alert('수정되었습니다.');
                window.location.href = `view.html?id=${id}`; // 상세 페이지로 복귀
            });
        });
    </script>
</body>
</html>
