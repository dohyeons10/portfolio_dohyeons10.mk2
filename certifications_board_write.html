<!DOCTYPE html>
<html lang="ko">
<a href="certifications_board.html" class="back-button">목록으로</a>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>자격증 내용 작성</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase_config.js"></script>
    <script src="admin_key.js"></script>
    <script src="auth.js"></script>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            alert('관리자만 작성할 수 있습니다.');
            window.location.href = 'certifications_board.html';
        }
    </script>
</head>

<body>
    <h1>자격증 내용 작성</h1>

    <form id="write-form">
        <label for="post-title">제목:</label><br>
        <input type="text" id="post-title" name="post-title"><br><br>

        <label for="post-image">자격증 사진 또는 PDF (선택):</label><br>
        <input type="file" id="post-image" accept="image/*,.pdf"><br>
        <img id="image-preview" alt="선택한 사진 미리보기" style="display: none; max-width: 100%; max-height: 300px; margin: 10px 0; object-fit: contain;">
        <iframe id="pdf-preview" title="선택한 PDF 미리보기" style="display: none; width: 100%; height: 400px; margin: 10px 0; border: 1px solid #ddd;"></iframe><br>

        <label for="post-content">내용:</label><br>
        <textarea id="post-content" name="post-content" rows="10" cols="50"></textarea><br><br>

        <button type="submit">글 올리기</button>
    </form>

    <script>
        let imageBase64 = '';

        document.getElementById('post-image').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/') && file.type !== 'application/pdf') {
                alert('이미지 또는 PDF 파일만 선택해주세요.');
                this.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                imageBase64 = event.target.result;
                const imagePreview = document.getElementById('image-preview');
                const pdfPreview = document.getElementById('pdf-preview');
                if (file.type === 'application/pdf') {
                    pdfPreview.src = imageBase64;
                    pdfPreview.style.display = 'block';
                    imagePreview.style.display = 'none';
                } else {
                    imagePreview.src = imageBase64;
                    imagePreview.style.display = 'block';
                    pdfPreview.style.display = 'none';
                }
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('write-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const date = new Date().toLocaleDateString();

            if (title && content) {
                db.ref('posts').once('value').then(snapshot => {
                    const data = snapshot.val() || {};
                    const certificationPosts = Object.values(data).filter(post => post.category === '자격증');
                    const lastOrder = certificationPosts.reduce((maxOrder, post) => {
                        return post.order !== undefined ? Math.max(maxOrder, Number(post.order)) : maxOrder;
                    }, -1);

                    return db.ref('posts').push({
                        category: '자격증',
                        title: title,
                        content: content,
                        image: imageBase64,
                        date: date,
                        order: lastOrder + 1
                    });
                }).then(() => {
                    alert('자격증 내용이 등록되었습니다.');
                    window.location.href = 'certifications_board.html';
                });
            } else {
                alert('제목과 내용을 모두 입력해주세요.');
            }
        });
    </script>
</body>
</html>
